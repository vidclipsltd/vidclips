name: Desktop Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-playback-analyser

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python AI pipeline syntax
        run: python -m compileall -q ../app ../scripts/desktop_analyze_video.py ../scripts/desktop_analyze_audio.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate VidClips Windows icon
        run: node scripts/generate-icon.cjs
      - run: npm run build
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VidClips-Windows-Installer
          path: desktop/release/*.exe
          if-no-files-found: error
